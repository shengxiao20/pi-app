[package]
name = "pi-app-desktop"
version = "0.1.0"
description = "Pi App desktop client"
authors = ["Pi App contributors"]
edition = "2021"

[lib]
name = "pi_app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.3", features = [] }
tauri-plugin-opener = "2.5.3"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }

[profile.dev]
incremental = true
