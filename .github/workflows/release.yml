name: Release Pi Native App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.8"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: $version" >&2
            exit 1
          fi
          node scripts/set-release-version.mjs "$version"
          npm install --package-lock-only --force --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json desktop/package.json desktop/src-tauri/Cargo.toml desktop/src-tauri/tauri.conf.json packages/*/package.json
          git diff --cached --quiet || git commit -m "chore: release v$version"
          git tag -a "v$version" -m "Release v$version"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=v$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:native
      - run: test -s packages/pi-native-app-darwin-arm64/Pi\ App.app/Contents/MacOS/pi-app-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64
          path: packages/pi-native-app-darwin-arm64

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run build:native
      - name: Verify Windows package
        shell: pwsh
        run: |
          $binary = "packages/pi-native-app-win32-x64-msvc/bin/pi-native-app.exe"
          if (-not (Test-Path $binary)) { throw "Missing $binary" }
          if ((Get-Item $binary).Length -le 0) { throw "Empty $binary" }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: packages/pi-native-app-win32-x64-msvc

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:native
      - run: test -s packages/pi-native-app-linux-x64-gnu/bin/pi-native-app
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: packages/pi-native-app-linux-x64-gnu

  publish:
    needs: [prepare, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: packages
      - name: Prepare npm manifests
        shell: node {0}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          root.optionalDependencies = {
            'pi-native-app-darwin-arm64': process.env.RELEASE_VERSION,
            'pi-native-app-win32-x64-msvc': process.env.RELEASE_VERSION,
            'pi-native-app-linux-x64-gnu': process.env.RELEASE_VERSION,
          };
          root.bundledDependencies = Object.keys(root.optionalDependencies);
          fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n');
          for (const name of root.bundledDependencies) {
            const path = `packages/${name}/package.json`;
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          }
      - run: npm publish packages/pi-native-app-darwin-arm64 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish packages/pi-native-app-win32-x64-msvc --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish packages/pi-native-app-linux-x64-gnu --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install published platform packages into root staging tree
        run: npm install --ignore-scripts --package-lock=false --no-save
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            packages/pi-native-app-darwin-arm64/Pi App.app/Contents/MacOS/pi-app-desktop
            packages/pi-native-app-win32-x64-msvc/bin/pi-native-app.exe
            packages/pi-native-app-linux-x64-gnu/bin/pi-native-app
