name: Publish Pi Native App release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: version
        shell: bash
        run: |
          version=$(node --input-type=module --eval "import manifest from './package.json' with { type: 'json' }; console.log(manifest.version)")
          if npm view "pi-native-app@$version" version --json 2>/dev/null | grep -q "\"$version\""; then
            echo "Version $version is already published; skipping release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: release-context
    if: needs.release-context.outputs.should_publish == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:native
      - run: test -s packages/pi-native-app-darwin-arm64/Pi\ App.app/Contents/MacOS/pi-app-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64
          path: packages/pi-native-app-darwin-arm64

  build-windows:
    needs: release-context
    if: needs.release-context.outputs.should_publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run build:native
      - name: Verify Windows package
        shell: pwsh
        run: |
          $binary = "packages/pi-native-app-win32-x64-msvc/bin/pi-native-app.exe"
          if (-not (Test-Path $binary)) { throw "Missing $binary" }
          if ((Get-Item $binary).Length -le 0) { throw "Empty $binary" }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: packages/pi-native-app-win32-x64-msvc

  publish:
    needs: [release-context, build-macos, build-windows]
    if: needs.release-context.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-arm64
          path: packages/pi-native-app-darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-x64
          path: packages/pi-native-app-win32-x64-msvc
      - name: Restore and verify downloaded platform artifacts
        shell: bash
        run: |
          chmod +x \
            packages/pi-native-app-darwin-arm64/bin/pi-native-app \
            packages/pi-native-app-darwin-arm64/Pi\ App.app/Contents/MacOS/pi-app-desktop
          test -x packages/pi-native-app-darwin-arm64/bin/pi-native-app
          test -x packages/pi-native-app-darwin-arm64/Pi\ App.app/Contents/MacOS/pi-app-desktop
          test -s packages/pi-native-app-win32-x64-msvc/bin/pi-native-app.exe
      - name: Prepare npm manifests
        shell: node {0}
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          root.optionalDependencies = {
            'pi-native-app-darwin-arm64': process.env.RELEASE_VERSION,
            'pi-native-app-win32-x64-msvc': process.env.RELEASE_VERSION,
          };
          fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n');
      - name: Publish a platform package when its version is absent
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          publish_platform() {
            local package_name="$1"
            local package_path="$2"
            if npm view "$package_name@$RELEASE_VERSION" version --json 2>/dev/null | grep -q "\"$RELEASE_VERSION\""; then
              echo "Version ${RELEASE_VERSION} is already published for ${package_name}."
              return
            fi
            npm publish "$package_path" --access public
          }
          publish_platform pi-native-app-darwin-arm64 ./packages/pi-native-app-darwin-arm64
          publish_platform pi-native-app-win32-x64-msvc ./packages/pi-native-app-win32-x64-msvc
      - run: npm run build:launcher
      - run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-context.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            packages/pi-native-app-darwin-arm64/Pi App.app/Contents/MacOS/pi-app-desktop
            packages/pi-native-app-win32-x64-msvc/bin/pi-native-app.exe
